[package]
name = "studio-core"
version = "0.1.0"
edition = "2021"
description = "StoryForge Studio 核心库：项目持久化 / 素材 / 时间轴求值 / 软件合成 / 音频混音 / FFmpeg 编码"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "ogg", "flac", "isomp4"] }
fontdue = "0.9"
rayon = "1"
rand = "0.8"
