[workspace]
members = ["crates/studio-core"]
resolver = "2"

[package]
name = "storyforge"
version = "0.1.0"
description = "StoryForge Studio — 剧情演出 / 视频创作编辑器"
edition = "2021"
default-run = "storyforge"

[lib]
name = "storyforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
studio-core = { path = "crates/studio-core" }
ctrlc = "3"

[[bin]]
name = "sf_export"
path = "src/bin/sf_export.rs"
